[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-page-changer-piano"
version = "2.0.0"
description = "Visor de partituras PDF con navegación MIDI y reproducción de video"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.11,<7",
    "PyMuPDF>=1.26,<2",
    "pygame>=2.6,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
